name: 🚀 Generate GitHub Profile

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # 📊 GENERATE PROFILE CARDS
  # ============================================================
  profile-cards:

    name: 📊 Generate Profile Cards
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📊 Generate Analytics Cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          from pathlib import Path
          from html import escape

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-generator"
          }


          # ----------------------------------------------------
          # GitHub API
          # ----------------------------------------------------

          def api(url):

              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          profile = api(
              f"https://api.github.com/users/{user}"
          )

          repos = api(
              f"https://api.github.com/users/{user}/repos?per_page=100"
          )


          # ----------------------------------------------------
          # Repository statistics
          # ----------------------------------------------------

          languages = {}

          stars = 0
          forks = 0

          for repo in repos:

              language = repo.get("language")

              if language:

                  languages[language] = (
                      languages.get(language, 0) + 1
                  )

              stars += repo.get(
                  "stargazers_count",
                  0
              )

              forks += repo.get(
                  "forks_count",
                  0
              )


          top_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True
          )[:8]


          # ----------------------------------------------------
          # Output directory
          # ----------------------------------------------------

          output = Path("profile")

          output.mkdir(
              exist_ok=True
          )


          # ----------------------------------------------------
          # SVG helper
          # ----------------------------------------------------

          def svg(
              title,
              body,
              height=220
          ):

              return f"""
              <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="495"
                  height="{height}"
                  viewBox="0 0 495 {height}"
              >

                  <defs>

                      <linearGradient
                          id="bg"
                          x1="0%"
                          y1="0%"
                          x2="100%"
                          y2="100%"
                      >

                          <stop
                              offset="0%"
                              stop-color="#161b22"
                          />

                          <stop
                              offset="100%"
                              stop-color="#0d1117"
                          />

                      </linearGradient>

                  </defs>


                  <rect
                      width="495"
                      height="{height}"
                      rx="16"
                      fill="url(#bg)"
                      stroke="#30363d"
                  />


                  <text
                      x="28"
                      y="42"
                      font-family="Arial"
                      font-size="21"
                      font-weight="700"
                      fill="#ffffff"
                  >
                      {escape(title)}
                  </text>


                  {body}

              </svg>
              """


          # ====================================================
          # 📊 GITHUB ANALYTICS
          # ====================================================

          stats = f"""

          <text
              x="28"
              y="78"
              font-family="Arial"
              font-size="12"
              fill="#8b949e"
          >
              PUBLIC REPOSITORIES
          </text>

          <text
              x="28"
              y="108"
              font-family="Arial"
              font-size="26"
              font-weight="700"
              fill="#58a6ff"
          >
              {profile.get("public_repos", 0)}
          </text>


          <text
              x="185"
              y="78"
              font-family="Arial"
              font-size="12"
              fill="#8b949e"
          >
              FOLLOWERS
          </text>

          <text
              x="185"
              y="108"
              font-family="Arial"
              font-size="26"
              font-weight="700"
              fill="#58a6ff"
          >
              {profile.get("followers", 0)}
          </text>


          <text
              x="335"
              y="78"
              font-family="Arial"
              font-size="12"
              fill="#8b949e"
          >
              STARS
          </text>

          <text
              x="335"
              y="108"
              font-family="Arial"
              font-size="26"
              font-weight="700"
              fill="#58a6ff"
          >
              {stars}
          </text>


          <text
              x="28"
              y="148"
              font-family="Arial"
              font-size="12"
              fill="#8b949e"
          >
              FORKS
          </text>

          <text
              x="28"
              y="175"
              font-family="Arial"
              font-size="20"
              font-weight="700"
              fill="#c9d1d9"
          >
              {forks}
          </text>


          <text
              x="185"
              y="148"
              font-family="Arial"
              font-size="12"
              fill="#8b949e"
          >
              GITHUB
          </text>

          <text
              x="185"
              y="175"
              font-family="Arial"
              font-size="17"
              font-weight="700"
              fill="#c9d1d9"
          >
              {escape(user)}
          </text>

          """


          (output / "stats.svg").write_text(
              svg(
                  "📊 GitHub Analytics",
                  stats
              ),
              encoding="utf-8"
          )


          # ====================================================
          # 💻 TOP LANGUAGES
          # ====================================================

          total = sum(
              count
              for _, count in top_languages
          ) or 1


          rows = []

          y = 75


          for language, count in top_languages:

              percentage = (
                  count / total
              ) * 100

              width = (
                  250 * percentage / 100
              )


              rows.append(

                  f"""
                  <text
                      x="28"
                      y="{y}"
                      font-family="Arial"
                      font-size="14"
                      fill="#c9d1d9"
                  >
                      {escape(language)}
                  </text>


                  <rect
                      x="150"
                      y="{y-13}"
                      width="250"
                      height="10"
                      rx="5"
                      fill="#30363d"
                  />


                  <rect
                      x="150"
                      y="{y-13}"
                      width="{width:.1f}"
                      height="10"
                      rx="5"
                      fill="#58a6ff"
                  />


                  <text
                      x="445"
                      y="{y}"
                      font-family="Arial"
                      font-size="12"
                      fill="#8b949e"
                      text-anchor="end"
                  >
                      {percentage:.1f}%
                  </text>
                  """

              )

              y += 25


          languages_height = max(
              220,
              y + 20
          )


          (output / "top-langs.svg").write_text(

              svg(
                  "💻 Top Languages",
                  "".join(rows),
                  languages_height
              ),

              encoding="utf-8"
          )


          # ====================================================
          # 🏆 GITHUB ACHIEVEMENTS
          # ====================================================

          achievements = f"""

          <text
              x="28"
              y="82"
              font-family="Arial"
              font-size="17"
              fill="#c9d1d9"
          >
              🏆 Developer Profile
          </text>


          <text
              x="28"
              y="118"
              font-family="Arial"
              font-size="24"
              font-weight="700"
              fill="#f2cc60"
          >
              {escape(user)}
          </text>


          <text
              x="28"
              y="150"
              font-family="Arial"
              font-size="13"
              fill="#8b949e"
          >
              Repositories
          </text>

          <text
              x="130"
              y="150"
              font-family="Arial"
              font-size="13"
              fill="#c9d1d9"
          >
              {profile.get("public_repos", 0)}
          </text>


          <text
              x="200"
              y="150"
              font-family="Arial"
              font-size="13"
              fill="#8b949e"
          >
              Followers
          </text>

          <text
              x="285"
              y="150"
              font-family="Arial"
              font-size="13"
              fill="#c9d1d9"
          >
              {profile.get("followers", 0)}
          </text>


          <text
              x="28"
              y="180"
              font-family="Arial"
              font-size="13"
              fill="#8b949e"
          >
              ⭐ Stars
          </text>

          <text
              x="100"
              y="180"
              font-family="Arial"
              font-size="13"
              fill="#c9d1d9"
          >
              {stars}
          </text>


          <text
              x="180"
              y="180"
              font-family="Arial"
              font-size="13"
              fill="#8b949e"
          >
              🍴 Forks
          </text>

          <text
              x="260"
              y="180"
              font-family="Arial"
              font-size="13"
              fill="#c9d1d9"
          >
              {forks}
          </text>

          """


          (output / "trophy.svg").write_text(

              svg(
                  "🏆 GitHub Achievements",
                  achievements
              ),

              encoding="utf-8"
          )


          print("✅ Profile cards generated successfully!")


          PY


      - name: 📤 Commit Profile Cards
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then

            echo "ℹ️ No profile card changes."

          else

            git commit \
              -m "📊 Update GitHub profile cards"

            git push

          fi


  # ============================================================
  # 🐍 GENERATE CONTRIBUTION SNAKE
  # ============================================================

  contribution-snake:

    name: 🐍 Generate Contribution Snake
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3

        with:

          github_user_name: ${{ github.repository_owner }}

          outputs: |

            dist/github-contribution-grid-snake.svg

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: 📤 Publish Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:

          target_branch: output

          build_dir: dist

          commit_message: "🐍 Update contribution snake"

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
