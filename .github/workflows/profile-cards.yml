name: Generate GitHub Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from html import escape

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "profile-cards"
          }

          def api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          profile = api(f"https://api.github.com/users/{user}")
          repos = api(f"https://api.github.com/users/{user}/repos?per_page=100")

          langs = {}
          for repo in repos:
              lang = repo.get("language")
              if lang:
                  langs[lang] = langs.get(lang, 0) + 1

          top = sorted(langs.items(), key=lambda x: x[1], reverse=True)[:8]
          stars = sum(r.get("stargazers_count", 0) for r in repos)
          forks = sum(r.get("forks_count", 0) for r in repos)

          out = Path("profile")
          out.mkdir(exist_ok=True)

          def svg(title, body, height=190):
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="495" height="{height}" viewBox="0 0 495 {height}">'
                  f'<rect width="495" height="{height}" rx="12" fill="#1f2330"/>'
                  f'<text x="28" y="40" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">{escape(title)}</text>'
                  f'{body}</svg>'
              )

          stats = (
              f'<text x="28" y="78" font-family="Arial" font-size="13" fill="#8b949e">PUBLIC REPOSITORIES</text>'
              f'<text x="28" y="108" font-family="Arial" font-size="26" font-weight="700" fill="#58a6ff">{profile.get("public_repos",0)}</text>'
              f'<text x="185" y="78" font-family="Arial" font-size="13" fill="#8b949e">FOLLOWERS</text>'
              f'<text x="185" y="108" font-family="Arial" font-size="26" font-weight="700" fill="#58a6ff">{profile.get("followers",0)}</text>'
              f'<text x="335" y="78" font-family="Arial" font-size="13" fill="#8b949e">STARS</text>'
              f'<text x="335" y="108" font-family="Arial" font-size="26" font-weight="700" fill="#58a6ff">{stars}</text>'
              f'<text x="28" y="145" font-family="Arial" font-size="13" fill="#8b949e">FORKS</text>'
              f'<text x="28" y="168" font-family="Arial" font-size="19" font-weight="700" fill="#c9d1d9">{forks}</text>'
              f'<text x="185" y="145" font-family="Arial" font-size="13" fill="#8b949e">USERNAME</text>'
              f'<text x="185" y="168" font-family="Arial" font-size="16" font-weight="700" fill="#c9d1d9">{escape(user)}</text>'
          )
          (out/"stats.svg").write_text(svg("GitHub Analytics", stats), encoding="utf-8")

          total = sum(v for _,v in top) or 1
          rows = []
          y = 70
          for lang, count in top:
              pct = count / total * 100
              width = 250 * pct / 100
              rows.append(
                  f'<text x="28" y="{y}" font-family="Arial" font-size="14" fill="#c9d1d9">{escape(lang)}</text>'
                  f'<rect x="150" y="{y-13}" width="250" height="10" rx="5" fill="#30363d"/>'
                  f'<rect x="150" y="{y-13}" width="{width:.1f}" height="10" rx="5" fill="#58a6ff"/>'
                  f'<text x="414" y="{y}" font-family="Arial" font-size="13" fill="#8b949e" text-anchor="end">{pct:.1f}%</text>'
              )
              y += 23
          (out/"top-langs.svg").write_text(svg("Top Languages","".join(rows),max(190,y+10)),encoding="utf-8")

          trophy = (
              f'<text x="28" y="85" font-family="Arial" font-size="16" fill="#c9d1d9">GitHub Profile Trophy</text>'
              f'<text x="28" y="120" font-family="Arial" font-size="26" font-weight="700" fill="#f2cc60">{escape(user)}</text>'
              f'<text x="28" y="155" font-family="Arial" font-size="14" fill="#8b949e">Repos: {profile.get("public_repos",0)} | Followers: {profile.get("followers",0)} | Stars: {stars}</text>'
          )
          (out/"trophy.svg").write_text(svg("GitHub Trophies",trophy),encoding="utf-8")
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
