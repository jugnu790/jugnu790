name: Profile Sync

on:
  schedule:
    # Runs approximately once per hour.
    # GitHub scheduled workflows are best-effort and may be delayed.
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: jugnu790
        run: python scripts/fetch_data.py

      - name: Process GitHub data
        run: python scripts/process_data.py

      - name: Build generated cards
        run: python scripts/build_cards.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: jugnu790
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Update README
        env:
          GITHUB_USERNAME: jugnu790
        run: python scripts/update_readme.py

      - name: Commit only if generated data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data assets README.md

          if git diff --cached --quiet; then
            echo "No generated changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: sync GitHub profile data"
          git push