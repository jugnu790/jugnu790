name: Profile Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout using GitHub's built-in token
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Setup Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ---------------------------------------------------------
      # Fetch GitHub profile data
      # ---------------------------------------------------------
      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: |
          python scripts/fetch_data.py

      # ---------------------------------------------------------
      # Process data
      # ---------------------------------------------------------
      - name: Process GitHub data
        run: |
          python scripts/process_data.py

      # ---------------------------------------------------------
      # Build cards
      # ---------------------------------------------------------
      - name: Build generated cards
        run: |
          python scripts/build_cards.py

      # ---------------------------------------------------------
      # Generate contribution snake
      # ---------------------------------------------------------
      - name: Generate contribution snake
        run: |
          if [ -f scripts/generate_snake.py ]; then
            python scripts/generate_snake.py
          else
            echo "generate_snake.py not found, skipping."
          fi

      # ---------------------------------------------------------
      # Update README
      # ---------------------------------------------------------
      - name: Update README
        run: |
          if [ -f scripts/update_readme.py ]; then
            python scripts/update_readme.py
          else
            echo "update_readme.py not found, skipping."
          fi

      # ---------------------------------------------------------
      # Commit generated files
      # ---------------------------------------------------------
      - name: Commit generated changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add assets/
          git add data/

          if [ -d "dist" ]; then
            git add dist/
          fi

          if [ -d "output" ]; then
            git add output/
          fi

          echo "Changes to be committed:"
          git status --short

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync GitHub profile data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # Get latest remote branch
      # ---------------------------------------------------------
      - name: Sync with remote
        if: steps.commit.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main

      # ---------------------------------------------------------
      # Push using built-in GITHUB_TOKEN
      # ---------------------------------------------------------
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main