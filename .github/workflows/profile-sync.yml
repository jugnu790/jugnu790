name: Profile Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # =========================================================
      # PYTHON
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =========================================================
      # DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # =========================================================
      # FETCH GITHUB DATA
      # =========================================================
      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: |
          python scripts/fetch_data.py

      # =========================================================
      # PROCESS DATA
      # =========================================================
      - name: Process GitHub data
        run: |
          python scripts/process_data.py

      # =========================================================
      # BUILD CARDS
      # =========================================================
      - name: Build generated cards
        run: |
          python scripts/build_cards.py

      # =========================================================
      # CONTRIBUTION SNAKE
      # =========================================================
      - name: Generate contribution snake
        run: |
          if [ -f scripts/generate_snake.py ]; then
            python scripts/generate_snake.py
          else
            echo "generate_snake.py not found. Skipping."
          fi

      # =========================================================
      # README
      # =========================================================
      - name: Update README
        run: |
          if [ -f scripts/update_readme.py ]; then
            python scripts/update_readme.py
          else
            echo "update_readme.py not found. Skipping."
          fi

      # =========================================================
      # SAVE GENERATED FILES
      # =========================================================
      - name: Save generated files
        run: |
          mkdir -p /tmp/generated

          cp -r data /tmp/generated/ 2>/dev/null || true
          cp -r assets /tmp/generated/ 2>/dev/null || true
          cp README.md /tmp/generated/README.md 2>/dev/null || true

          if [ -d "dist" ]; then
            cp -r dist /tmp/generated/
          fi

          if [ -d "output" ]; then
            cp -r output /tmp/generated/
          fi

      # =========================================================
      # RESET LOCAL CHANGES
      # =========================================================
      - name: Sync with latest main
        run: |
          echo "Fetching latest main..."

          git fetch origin main

          echo "Resetting to latest remote main..."

          git reset --hard origin/main

          echo "Latest main checked out successfully."

      # =========================================================
      # RESTORE GENERATED FILES
      # =========================================================
      - name: Restore generated files
        run: |
          cp -r /tmp/generated/data . 2>/dev/null || true
          cp -r /tmp/generated/assets . 2>/dev/null || true
          cp /tmp/generated/README.md . 2>/dev/null || true

          if [ -d "/tmp/generated/dist" ]; then
            cp -r /tmp/generated/dist .
          fi

          if [ -d "/tmp/generated/output" ]; then
            cp -r /tmp/generated/output .
          fi

      # =========================================================
      # COMMIT
      # =========================================================
      - name: Commit generated changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add data/
          git add assets/

          if [ -d "dist" ]; then
            git add dist/
          fi

          if [ -d "output" ]; then
            git add output/
          fi

          echo "======================================"
          echo "Changes:"
          echo "======================================"

          git status --short

          if git diff --cached --quiet; then
            echo "No generated changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync GitHub profile data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # =========================================================
      # PUSH
      # =========================================================
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      # =========================================================
      # NOTHING TO PUSH
      # =========================================================
      - name: No changes
        if: steps.commit.outputs.changed == 'false'
        run: |
          echo "Everything is already up to date."