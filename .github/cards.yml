name: Build profile cards

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_cards.py"
      - ".github/workflows/cards.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cards
        env:
          # GH_PAT is optional. A classic PAT with read:user + repo also counts
          # private contributions; without it that number shows as 0.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/build_cards.py ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/activity.svg assets/highlights.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push