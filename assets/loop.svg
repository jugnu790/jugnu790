<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="Engineering loop: learn, build, break, debug, understand, improve">
<defs>
  <radialGradient id="lg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0F766E" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
  </radialGradient>
  <filter id="lgl" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <path id="ring" d="M 320 100 A 132 132 0 1 1 319.99 100 Z"/>
</defs>
<rect width="640" height="470" rx="16" fill="#020617"/>
