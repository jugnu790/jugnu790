<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Animated microservices architecture: client to gateway to services to Kafka to datastores to Elasticsearch and Kibana">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#061725"/>
    </linearGradient>
    <linearGradient id="kafka" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <pattern id="g2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#0E7490" stroke-opacity="0.12"/>
    </pattern>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="pk"><circle r="5" fill="#F59E0B" filter="url(#fglow)"/></g>
    <g id="pk2"><circle r="4.5" fill="#22D3EE" filter="url(#fglow)"/></g>
    <g id="pk3"><circle r="4.5" fill="#4ADE80" filter="url(#fglow)"/></g>

    <path id="a1" d="M500 62 V104"/>
    <path id="a2" d="M500 152 C500 176 215 172 215 196"/>
    <path id="a3" d="M500 152 V196"/>
    <path id="a4" d="M500 152 C500 176 785 172 785 196"/>
    <path id="b1" d="M215 242 V292"/>
    <path id="b2" d="M500 242 V292"/>
    <path id="b3" d="M785 242 V292"/>
    <path id="c1" d="M320 340 C320 366 230 366 230 392"/>
    <path id="c2" d="M500 340 V392"/>
    <path id="c3" d="M680 340 C680 366 780 366 780 392"/>
    <path id="d1" d="M230 438 C230 458 380 452 380 472"/>
    <path id="d2" d="M780 438 C780 458 380 452 380 472"/>
    <path id="d3" d="M480 494 H556"/>
  </defs>

  <rect width="1000" height="540" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="540" rx="16" fill="url(#g2)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" fill="#E2E8F0" font-size="14" text-anchor="middle">

    <!-- wires -->
    <g fill="none" stroke="#155E75" stroke-width="1.6">
      <use xlink:href="#a1" href="#a1"/><use xlink:href="#a2" href="#a2"/><use xlink:href="#a3" href="#a3"/><use xlink:href="#a4" href="#a4"/>
      <use xlink:href="#b1" href="#b1"/><use xlink:href="#b2" href="#b2"/><use xlink:href="#b3" href="#b3"/>
      <use xlink:href="#c1" href="#c1"/><use xlink:href="#c2" href="#c2"/><use xlink:href="#c3" href="#c3"/>
      <use xlink:href="#d1" href="#d1"/><use xlink:href="#d2" href="#d2"/><use xlink:href="#d3" href="#d3"/>
    </g>

    <!-- client -->
    <g>
      <rect x="430" y="20" width="140" height="42" rx="21" fill="#0B1220" stroke="#22D3EE"/>
      <text x="500" y="46" fill="#67E8F9" letter-spacing="2">CLIENT</text>
      <rect x="430" y="20" width="140" height="42" rx="21" fill="none" stroke="#22D3EE">
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1;5;1" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- gateway -->
    <rect x="400" y="104" width="200" height="48" rx="10" fill="#08202B" stroke="#0891B2"/>
    <text x="500" y="134" letter-spacing="2">API GATEWAY</text>

    <!-- services -->
    <g>
      <rect x="140" y="196" width="150" height="46" rx="10" fill="#0B1220" stroke="#0F766E"/>
      <text x="215" y="224" font-size="13">BILLING SVC</text>
      <rect x="425" y="196" width="150" height="46" rx="10" fill="#0B1220" stroke="#0F766E"/>
      <text x="500" y="224" font-size="13">PAYMENT SVC</text>
      <rect x="710" y="196" width="150" height="46" rx="10" fill="#0B1220" stroke="#0F766E"/>
      <text x="785" y="224" font-size="13">SETTLEMENT SVC</text>
    </g>

    <!-- kafka bus -->
    <g>
      <rect x="180" y="292" width="640" height="48" rx="10" fill="#062B33" stroke="url(#kafka)" stroke-width="2"/>
      <text x="500" y="322" fill="#67E8F9" letter-spacing="4">APACHE KAFKA &#183; EVENT BUS</text>
      <rect x="180" y="292" width="140" height="48" rx="10" fill="#22D3EE" opacity="0.12">
        <animate attributeName="x" values="180;680;180" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- stores -->
    <g font-size="13">
      <rect x="150" y="392" width="160" height="46" rx="10" fill="#0B1220" stroke="#0EA5E9"/>
      <text x="230" y="420">PostgreSQL</text>
      <rect x="420" y="392" width="160" height="46" rx="10" fill="#0B1220" stroke="#F59E0B"/>
      <text x="500" y="420">Redis</text>
      <rect x="700" y="392" width="160" height="46" rx="10" fill="#0B1220" stroke="#0EA5E9"/>
      <text x="780" y="420">Cassandra</text>
    </g>

    <!-- observability -->
    <g font-size="13">
      <rect x="280" y="472" width="200" height="44" rx="10" fill="#0B1220" stroke="#14B8A6"/>
      <text x="380" y="499">Elasticsearch</text>
      <rect x="556" y="472" width="160" height="44" rx="10" fill="#0B1220" stroke="#14B8A6"/>
      <text x="636" y="499">Kibana</text>
    </g>
  </g>

  <!-- in-flight traffic -->
  <g>
    <use xlink:href="#pk" href="#pk"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#a1" href="#a1"/></animateMotion></use>
    <use xlink:href="#pk" href="#pk"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite"><mpath xlink:href="#a1" href="#a1"/></animateMotion></use>

    <use xlink:href="#pk" href="#pk"><animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#a2" href="#a2"/></animateMotion></use>
    <use xlink:href="#pk" href="#pk"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#a3" href="#a3"/></animateMotion></use>
    <use xlink:href="#pk" href="#pk"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#a4" href="#a4"/></animateMotion></use>

    <use xlink:href="#pk2" href="#pk2"><animateMotion dur="1.5s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#b1" href="#b1"/></animateMotion></use>
    <use xlink:href="#pk2" href="#pk2"><animateMotion dur="1.5s" begin="0.8s" repeatCount="indefinite"><mpath xlink:href="#b2" href="#b2"/></animateMotion></use>
    <use xlink:href="#pk2" href="#pk2"><animateMotion dur="1.5s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#b3" href="#b3"/></animateMotion></use>

    <use xlink:href="#pk3" href="#pk3"><animateMotion dur="1.9s" begin="0.4s" repeatCount="indefinite"><mpath xlink:href="#c1" href="#c1"/></animateMotion></use>
    <use xlink:href="#pk3" href="#pk3"><animateMotion dur="1.7s" begin="1.0s" repeatCount="indefinite"><mpath xlink:href="#c2" href="#c2"/></animateMotion></use>
    <use xlink:href="#pk3" href="#pk3"><animateMotion dur="1.9s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#c3" href="#c3"/></animateMotion></use>

    <use xlink:href="#pk2" href="#pk2"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#d1" href="#d1"/></animateMotion></use>
    <use xlink:href="#pk2" href="#pk2"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#d2" href="#d2"/></animateMotion></use>
    <use xlink:href="#pk2" href="#pk2"><animateMotion dur="1.1s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#d3" href="#d3"/></animateMotion></use>
  </g>
</svg>
