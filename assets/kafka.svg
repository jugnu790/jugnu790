<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Animated Kafka flow: producers to topic partitions to consumers">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#06182A"/>
    </linearGradient>
    <linearGradient id="msg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="kg" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="250" rx="14" fill="url(#kbg)" stroke="#0E7490" stroke-opacity="0.5"/>

  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" fill="#CBD5E1" font-size="12" text-anchor="middle">

    <!-- lanes -->
    <g stroke="#155E75" stroke-opacity="0.5" stroke-dasharray="4 6">
      <line x1="160" y1="70" x2="840" y2="70"/>
      <line x1="160" y1="125" x2="840" y2="125"/>
      <line x1="160" y1="180" x2="840" y2="180"/>
    </g>

    <!-- topic -->
    <rect x="360" y="34" width="280" height="182" rx="12" fill="#062B33" stroke="#0891B2" stroke-width="2"/>
    <text x="500" y="24" fill="#67E8F9" font-size="12" letter-spacing="3">bill.payment.events</text>
    <g fill="#0E7490" opacity="0.35">
      <rect x="376" y="56" width="248" height="28" rx="6"/>
      <rect x="376" y="111" width="248" height="28" rx="6"/>
      <rect x="376" y="166" width="248" height="28" rx="6"/>
    </g>
    <g fill="#5EEAD4" font-size="10" text-anchor="start">
      <text x="384" y="74">partition-0</text>
      <text x="384" y="129">partition-1</text>
      <text x="384" y="184">partition-2</text>
    </g>

    <!-- producers -->
    <g>
      <rect x="20" y="48" width="140" height="44" rx="10" fill="#0B1220" stroke="#0F766E"/><text x="90" y="75">PRODUCER</text>
      <rect x="20" y="103" width="140" height="44" rx="10" fill="#0B1220" stroke="#0F766E"/><text x="90" y="130">PRODUCER</text>
      <rect x="20" y="158" width="140" height="44" rx="10" fill="#0B1220" stroke="#0F766E"/><text x="90" y="185">PRODUCER</text>
    </g>

    <!-- consumers -->
    <g>
      <rect x="840" y="48" width="140" height="44" rx="10" fill="#0B1220" stroke="#14B8A6"/><text x="910" y="75">CONSUMER</text>
      <rect x="840" y="103" width="140" height="44" rx="10" fill="#0B1220" stroke="#14B8A6"/><text x="910" y="130">CONSUMER</text>
      <rect x="840" y="158" width="140" height="44" rx="10" fill="#0B1220" stroke="#14B8A6"/><text x="910" y="185">CONSUMER</text>
    </g>

    <text x="910" y="222" fill="#64748B" font-size="10">consumer-group: settlement</text>
  </g>

  <!-- messages in flight -->
  <g filter="url(#kg)">
    <rect x="160" y="63" width="26" height="14" rx="4" fill="url(#msg)"><animate attributeName="x" values="160;840" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="160" y="63" width="26" height="14" rx="4" fill="url(#msg)"><animate attributeName="x" values="160;840" dur="3.4s" begin="1.7s" repeatCount="indefinite"/></rect>

    <rect x="160" y="118" width="26" height="14" rx="4" fill="url(#msg)"><animate attributeName="x" values="160;840" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="160" y="118" width="26" height="14" rx="4" fill="url(#msg)"><animate attributeName="x" values="160;840" dur="4.2s" begin="2.7s" repeatCount="indefinite"/></rect>

    <rect x="160" y="173" width="26" height="14" rx="4" fill="url(#msg)"><animate attributeName="x" values="160;840" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></rect>
    <rect x="160" y="173" width="26" height="14" rx="4" fill="url(#msg)"><animate attributeName="x" values="160;840" dur="2.9s" begin="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- consumer ack pulses -->
  <g fill="none" stroke="#4ADE80">
    <circle cx="840" cy="70" r="4"><animate attributeName="r" values="4;16" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="125" r="4"><animate attributeName="r" values="4;16" dur="4.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="180" r="4"><animate attributeName="r" values="4;16" dur="2.9s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
